name: Publish quiz collection

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run collection tests
        run: node --test test/*.test.mjs
      - name: Check quiz JavaScript
        run: |
          node --check quizzes/youre-next-couple/assets/app.mjs
          node --check quizzes/youre-next-couple/assets/quiz.mjs
          node --check quizzes/youre-next-survival/assets/app.mjs
          node --check quizzes/youre-next-survival/assets/audio.mjs
          node --check quizzes/youre-next-survival/assets/game.mjs

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
