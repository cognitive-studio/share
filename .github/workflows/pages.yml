name: Publish Share collection

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install media verifier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Run collection tests
        run: node --test test/*.test.mjs
      - name: Check every experience JavaScript module
        run: |
          find quizzes games -type f -name '*.mjs' -print0 | xargs -0 -r -n 1 node --check
      - name: Validate Siren Shore score
        run: python3 scripts/generate_siren_score.py --check

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
