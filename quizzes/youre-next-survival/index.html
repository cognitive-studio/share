<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0a">
    <meta name="description" content="A five-minute branching survival game set inside the atmosphere of You're Next.">
    <title>Can You Survive You’re Next?</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./assets/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#game">Skip to game</a>
    <header class="site-bar">
      <a class="brand" href="../../" aria-label="Return to the Cognitive Studio share shelf">
        <span>BUZZED</span><b>AFTER DARK</b>
      </a>
      <span class="edition">THE KENDRA RIDDLE CUT</span>
      <button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="true">
        <span class="sound-waves" aria-hidden="true"><i></i><i></i><i></i></span>
        <span data-sound-label>SOUND ON</span>
      </button>
      <button class="quiz-share" type="button" data-share-quiz data-share-title="Can You Survive You’re Next?" data-share-text="Enter the house and see whether you survive.">
        <span aria-hidden="true">↗</span><span data-share-label>SHARE QUIZ</span>
      </button>
    </header>
    <main id="game" class="game-shell" tabindex="-1"></main>
    <div id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <noscript>This house requires JavaScript. The intruders consider this a tactical advantage.</noscript>
    <script type="module" src="./assets/app.mjs"></script>
    <script type="module" src="../../assets/share.mjs"></script>
  </body>
</html>
